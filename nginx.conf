server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Redirige cualquier subruta hacia index.html para que Vue Router maneje el enrutamiento
        try_files $uri $uri/ /index.html;
    }

    # Configuración opcional para almacenamiento en caché de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webmanifest)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}